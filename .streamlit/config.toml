[server]
# Keep uploads small enough for the free Streamlit Community Cloud tier.
maxUploadSize = 25

[browser]
gatherUsageStats = false

# Brand theme. Light and dark are set separately so visitors keep the dark mode option;
# the primary colours match the validated chart colours in ui/charts.py.
[theme]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFontWeights = [700, 650, 600, 600, 600, 600]
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
linkColor = "#1f62b8"
secondaryBackgroundColor = "#f3f6fb"
borderColor = "#dfe5ee"

[theme.dark]
primaryColor = "#3987e5"
linkColor = "#6aa8f0"
